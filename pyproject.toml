[project]
name = "deptool"
version = "0.1.0"
description = "Evidence gathering for AI-assisted dependency review — the deterministic half of the `deps` Claude Code plugin."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Daniel Gutson" }]

# Intentionally empty, and it must stay that way. The plugin ships this package
# and runs it as `python3 -m deptool` on whatever interpreter the user has, with
# no install step. Anything added here becomes a runtime requirement for every
# repository the plugin is pointed at.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deptool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
